name = "mcp-memory"
main = "src/index.js"
compatibility_date = "2025-07-24"

# 保留 Cloudflare 控制台配置的环境变量（GITHUB_REPO/GITHUB_TOKEN/AGNES_API_KEY等）
keep_vars = true

# no-bundle 模式保持多文件结构
# 显式开启 find_additional_modules，遍历 src/ 下所有文件
find_additional_modules = true

[[rules]]
type = "ESModule"
globs = ["**/*.js"]
fallthrough = true

[vars]
SUPABASE_URL = "https://shxfosnnaoxzscrhvkat.supabase.co"
# v6: 多仓库白名单（逗号分隔）。Dashboard 配置的环境变量优先于此处默认值。
GITHUB_ALLOWED_REPOS = "wovowx/mcp-memory,wovowx/ZivenLab"
# Phase 1.5 @GPT 闭环：chat2api 通道配置（Dashboard 覆盖优先）
CHAT2API_URL = "https://chat2api-1029559493109-1029559493109.asia-northeast1.run.app/v1/chat/completions"
GPT_CONVERSATION_ID = "6a98cb19-3b88-83ee-a7be-314d60f0aa64"

[triggers]
crons = ["* * * * *"]