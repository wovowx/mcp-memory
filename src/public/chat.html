<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Common Ground · 深空协作舱</title>
<style>
:root{color-scheme:dark;--bg:#070a17;--panel:rgba(18,26,45,.72);--panel2:rgba(28,38,64,.75);--line:rgba(138,164,255,.16);--text:#edf2ff;--muted:#8f9bb5;--accent:#8fa8ff;--user:#263657;--agent:#1a2940;--gpt:#7AA7FF;--ziv:#B38CFF;--liu:#FFD6A5;--ok:#7ee2a8}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#070a17;color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden;
  background-image:
    radial-gradient(1100px 520px at 12% -8%,rgba(122,167,255,.16),transparent 60%),
    radial-gradient(900px 480px at 88% -12%,rgba(179,140,255,.16),transparent 60%),
    radial-gradient(700px 700px at 50% 120%,rgba(255,214,165,.07),transparent 55%);
  background-attachment:fixed}
.app{height:100%;display:grid;grid-template-columns:280px 1fr}
/* ===== 侧栏 ===== */
.sidebar{border-right:1px solid var(--line);background:rgba(8,12,26,.72);padding:18px;display:flex;flex-direction:column;min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font-size:21px;font-weight:800;margin-bottom:4px;background:linear-gradient(100deg,#8fb4ff 0%,#b38cff 60%,#ffd6a5 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.4px}
.brand-sub{font-size:11px;color:var(--muted);margin-bottom:16px;letter-spacing:2px}
.new{width:100%;border:1px solid var(--line);background:linear-gradient(135deg,rgba(122,167,255,.12),rgba(179,140,255,.12));color:var(--text);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:border-color .18s,transform .12s}
.new:hover{border-color:rgba(138,164,255,.5);transform:translateY(-1px)}
.threads{margin-top:16px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.thread{padding:11px 13px;border-radius:11px;cursor:pointer;color:#cbd4ea;border:1px solid transparent;transition:background .15s,border-color .15s}
.thread:hover{background:rgba(24,34,58,.6);border-color:var(--line)}
.thread.active{background:linear-gradient(135deg,rgba(122,167,255,.14),rgba(179,140,255,.14));border-color:rgba(138,164,255,.35);color:#fff}
.thread small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
/* ===== 主区 ===== */
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.header{padding:15px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;background:rgba(7,10,23,.42);backdrop-filter:blur(10px)}
.title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.status{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.messages{padding:22px;flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.empty{margin:auto;color:var(--muted);text-align:center}
/* 消息气泡 */
.msg{max-width:min(760px,88%);padding:12px 14px;border:1px solid rgba(138,164,255,.13);border-radius:16px;background:rgba(15,22,40,.6);position:relative;backdrop-filter:blur(6px)}
.msg.user{align-self:flex-end;background:linear-gradient(150deg,rgba(255,214,165,.12),rgba(255,214,165,.04));border-color:rgba(255,214,165,.2)}
.msg.gpt{border-color:rgba(122,167,255,.22)}
.msg.ziv{border-color:rgba(179,140,255,.25)}
.meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ava{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ava.gpt{background:rgba(122,167,255,.18);color:var(--gpt)}.ava.ziv{background:rgba(179,140,255,.18);color:var(--ziv)}.ava.liu{background:rgba(255,214,165,.18);color:var(--liu)}.ava.sys{background:rgba(142,155,181,.16);color:var(--muted)}
.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.reply{font-size:11px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin-bottom:7px}
.mBadge{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.7;margin:0 2px;vertical-align:1px}
.mBadge.gpt{background:rgba(122,167,255,.14);color:var(--gpt)}.mBadge.ziv{background:rgba(179,140,255,.14);color:var(--ziv)}.mBadge.all{background:rgba(255,214,165,.14);color:var(--liu)}
/* toolcard */
.toolcalls{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.toolcard{border:1px solid rgba(138,164,255,.14);border-radius:11px;background:rgba(10,16,32,.6);overflow:hidden}
.toolcard summary{cursor:pointer;padding:8px 12px;font-size:13px;color:#cbd4ea;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
.toolcard summary::-webkit-details-marker{display:none}
.toolcard summary:before{content:'▸';margin-right:4px;color:var(--muted);transition:transform .15s}
.toolcard[open] summary:before{transform:rotate(90deg)}
.toolbody{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid rgba(138,164,255,.1);display:flex;flex-direction:column;gap:5px}
.toolarg{white-space:pre-wrap;overflow-wrap:anywhere}
.toolres{color:#a8d5a2;white-space:pre-wrap;overflow-wrap:anywhere}
.toolerr{color:#f0a0a0;white-space:pre-wrap;overflow-wrap:anywhere}
/* ===== 输入区（单行，永远不被挤） ===== */
.composer{padding:13px 16px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;background:rgba(7,10,23,.6);flex:0 0 auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mWrap{position:relative;flex:1;display:flex;flex-direction:column;min-width:0}
textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:1px solid rgba(138,164,255,.22);background:rgba(16,24,42,.8);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;outline:none;overflow:auto;transition:border-color .18s,box-shadow .18s}
textarea:focus{border-color:rgba(143,168,255,.6);box-shadow:0 0 0 3px rgba(143,168,255,.12)}
button.send{border:0;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer;align-self:flex-end;height:46px;color:#0a0f1e;background:linear-gradient(135deg,#8fb4ff,#b38cff);transition:transform .12s,filter .15s}
button.send:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
/* @ 悬浮下拉（不占布局） */
.mDrop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:230px;overflow:auto;background:rgba(13,19,36,.94);border:1px solid rgba(138,164,255,.2);border-radius:14px;padding:6px;display:none;z-index:70;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mDrop.open{display:block;animation:dropIn .14s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mDrop .mItem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;min-height:46px}
.mDrop .mItem:hover,.mDrop .mItem.sel{background:rgba(28,38,64,.6)}
.mDrop .mAva{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mDrop .mAva.gpt{background:rgba(122,167,255,.2);color:var(--gpt)}.mDrop .mAva.ziv{background:rgba(179,140,255,.2);color:var(--ziv)}.mDrop .mAva.liu{background:rgba(255,214,165,.2);color:var(--liu)}
.mDrop .mInfo{min-width:0}.mDrop .mName{font-size:14px;font-weight:650}.mDrop .mDesc{font-size:11px;color:var(--muted)}
/* ===== 移动端 ===== */
.mobile-header{display:none;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(7,10,23,.8);position:sticky;top:0;z-index:30;flex-shrink:0;backdrop-filter:blur(12px)}
.mobile-header .burger{background:none;border:0;color:var(--text);font-size:22px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px;touch-action:manipulation}
.mobile-header .m-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{display:none}
@media(max-width:720px){
.app{grid-template-columns:1fr}
.sidebar{position:fixed;top:0;bottom:0;left:-300px;width:300px;z-index:20;transition:left .22s ease}
.sidebar.open{left:0}
.mobile-header{display:flex}
.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;backdrop-filter:blur(2px)}
.messages{padding:14px}
.main .header{display:none}
.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.msg{max-width:94%}
}
.notice{padding:10px 18px;color:#f0c98a;font-size:12px;display:none;border-top:1px solid var(--line);flex:0 0 auto}
</style>
</head>
<body>
<div class="mobile-header"><button class="burger" id="threadToggle" type="button" aria-label="打开讨论列表">☰</button><span class="m-title" id="mobileTitle">Common Ground</span></div>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar">
<div class="brand">Common Ground</div>
<div class="brand-sub">深空协作舱</div>
<button class="new" id="newThread" type="button">＋ 新讨论</button>
<div class="threads" id="threads"><div class="empty">加载中…</div></div>
</aside>
<main class="main">
<header class="header"><div class="title" id="threadTitle">选择一个讨论</div><div class="status" id="status">MVP</div></header>
<section class="messages" id="messages"><div class="empty">选择或新建一个 Thread</div></section>
<div class="notice" id="notice"></div>
<form class="composer" id="composer">
<div class="mWrap">
<div class="mDrop" id="mDrop"></div>
<textarea id="input" placeholder="输入消息… @ 选择成员" disabled></textarea>
</div>
<button class="send" type="submit" disabled>发送</button>
</form>
</main>
</div>
<script>
'use strict';
const API={threads:'/api/chat/threads',messages:id=>`/api/chat/threads/${encodeURIComponent(id)}/messages`};
let currentThread=null;
const POLL_MS=5000;let polling=false;let renderedIds=new Set();
const $=id=>document.getElementById(id);
function requireElement(id){const el=document.getElementById(id);if(!el)throw new Error('Missing element: '+id);return el}
function notice(text){const n=$('notice');n.textContent=text;n.style.display=text?'block':'none'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(`${r.status} ${typeof data==='string'?data:JSON.stringify(data)}`);return data}
function normalizeList(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.threads))return data.threads;if(data&&Array.isArray(data.data))return data.data;return []}
function normalizeMessages(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.messages))return data.messages;if(data&&Array.isArray(data.data))return data.data;return []}
function threadId(t){return t.thread_id||t.id}
function isMobile(){return window.innerWidth<=720}
function afterThreadNavigate(){if(isMobile())closeThreads()}
const AVATAR_META={liuliu:{icon:'☀',cls:'liu'},gpt:{icon:'✦',cls:'gpt'},ziven:{icon:'✧',cls:'ziv'}};
function avatarCls(a){const k=(a||'').toLowerCase();return (AVATAR_META[k]||{cls:'sys'}).cls}
function avatarIcon(a){const k=(a||'').toLowerCase();return (AVATAR_META[k]||{icon:'·'}).icon}
function renderThreads(items){const box=$('threads');box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">还没有讨论</div>';return}for(const t of items){const id=threadId(t);if(!id)continue;const el=document.createElement('div');el.className='thread'+(String(id)===String(currentThread)?' active':'');el.dataset.id=id;const title=document.createElement('div');title.textContent=t.title||'未命名话题';const small=document.createElement('small');small.textContent=t.status||'active';el.append(title,small);el.addEventListener('click',()=>{selectThread(id,t);afterThreadNavigate()});box.appendChild(el)}}
async function loadThreads(selectFirst=true){try{notice('');const data=await api(API.threads);const list=normalizeList(data);renderThreads(list);if(selectFirst&&list.length&&!currentThread)await selectThread(threadId(list[0]),list[0]);}catch(e){console.error(e);notice('加载 Thread 失败：'+e.message)}}
async function selectThread(id,thread){currentThread=id;requireElement('threadTitle').textContent=thread?.title||'未命名话题';requireElement('mobileTitle').textContent=thread?.title||'未命名话题';requireElement('input').disabled=false;const sendBtn=document.querySelector('#composer .send');if(sendBtn)sendBtn.disabled=false;renderThreads(normalizeListFromDom());requireElement('messages').innerHTML='<div class="empty">加载消息中…</div>';try{const data=await api(API.messages(id));renderMessages(normalizeMessages(data))}catch(e){console.error(e);requireElement('messages').innerHTML='<div class="empty">加载消息失败</div>';notice('加载消息失败：'+e.message)}}
function normalizeListFromDom(){return [...document.querySelectorAll('.thread')].map(el=>({thread_id:el.dataset.id,title:el.querySelector('div')?.textContent,status:el.querySelector('small')?.textContent}))}
function buildMessageEl(m){const el=document.createElement('article');el.className='msg '+(avatarCls(m.author))+((m.author||'').toLowerCase()==='liuliu'?' user':'')+(m.message_id&&String(m.message_id).startsWith('local-')?' optimistic':'');el.dataset.author=(m.author||'').toLowerCase();const meta=document.createElement('div');meta.className='meta';const av=document.createElement('span');av.className='ava '+avatarCls(m.author);av.textContent=avatarIcon(m.author);meta.appendChild(av);meta.appendChild(document.createTextNode(`${m.author||'unknown'} · ${formatTime(m.created_at)}`));if(m.reply_to){const reply=document.createElement('div');reply.className='reply';reply.textContent='回复：'+m.reply_to;el.appendChild(reply)}if(m.tool_calls&&Array.isArray(m.tool_calls)){el.appendChild(renderToolCalls(m.tool_calls))}const content=document.createElement('div');content.className='content';content.innerHTML=renderContent(cleanContent(m.content||''));el.append(meta,content);return el}
function renderMessages(items){const box=$('messages');box.innerHTML='';renderedIds.clear();if(!items.length){box.innerHTML='<div class="empty">这个讨论还没有消息</div>';return}for(const m of items){if(m.message_id||m.id)renderedIds.add(m.message_id||m.id);box.appendChild(buildMessageEl(m))}box.scrollTop=box.scrollHeight}
function isNearBottom(box,threshold=80){return box.scrollHeight-box.scrollTop-box.clientHeight<threshold}
function appendMessages(items){if(!items.length)return;const box=$('messages');const empty=box.querySelector('.empty');if(empty)empty.remove();const followScroll=isNearBottom(box);let added=false;for(const m of items){const mid=m.message_id||m.id;if(mid&&renderedIds.has(mid))continue;if(mid&&!String(mid).startsWith('local-')){box.querySelectorAll('.msg.optimistic').forEach(el=>{const c=el.querySelector('.content')?.textContent;if((el.dataset.author||'')===(m.author||'').toLowerCase()&&c===m.content)el.remove()})}if(mid)renderedIds.add(mid);box.appendChild(buildMessageEl(m));added=true}if(added&&followScroll)box.scrollTop=box.scrollHeight}
async function pollMessages(){if(!currentThread||polling)return;polling=true;try{const data=await api(API.messages(currentThread));appendMessages(normalizeMessages(data))}catch(e){}finally{polling=false}}
function formatTime(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function cleanContent(text){if(!text)return '';return text.replace(/\u26a0message_reaction\u26a0.*?\u26a0/gs,'').replace(/\u26a0[^\u26a0]*\u26a0/g,'').trim()}
function renderToolCalls(tools){const wrap=document.createElement('div');wrap.className='toolcalls';for(const t of tools){const card=document.createElement('details');card.className='toolcard';const sum=document.createElement('summary');const status=t.status==='success'?'✅':(t.status==='failed'?'❌':(t.status==='running'?'⏳':'🔧'));sum.textContent=`${status} ${t.tool_name||'tool'}`;const body=document.createElement('div');body.className='toolbody';if(t.arguments){const a=document.createElement('div');a.className='toolarg';a.textContent='参数: '+JSON.stringify(t.arguments);body.appendChild(a)}if(t.result!=null){const r=document.createElement('div');r.className='toolres';r.textContent='结果: '+(typeof t.result==='string'?t.result:JSON.stringify(t.result));body.appendChild(r)}if(t.error){const e=document.createElement('div');e.className='toolerr';e.textContent='错误: '+t.error;body.appendChild(e)}card.append(sum,body);wrap.appendChild(card)}return wrap}
function parseMentions(content){const result=[];if(/@all\b/i.test(content))result.push('gpt','ziven');if(/@GPT\b/i.test(content)&&!result.includes('gpt'))result.push('gpt');if(/@Ziven\b/i.test(content)&&!result.includes('ziven'))result.push('ziven');return result}
/* ===== Mention UX v2：只在 @ 时悬浮弹出，不占布局 ===== */
const MENTIONS=[{id:'gpt',tag:'GPT',icon:'✦',cls:'gpt',desc:'协作者 · 蓝色智能体'},{id:'ziven',tag:'Ziven',icon:'✧',cls:'ziv',desc:'哥哥 · 紫色智能体'},{id:'all',tag:'all',icon:'☀',cls:'liu',desc:'全体成员'}];
let composing=false,dropSel=-1;
const mInput=requireElement('input'),mDrop=requireElement('mDrop');
function curToken(v){const m=v.match(/@([\w-]*)$/);return m?('@'+m[1].toLowerCase()):null}
function renderDrop(list){mDrop.innerHTML='';list.forEach((x,i)=>{const it=document.createElement('div');it.className='mItem'+(i===dropSel?' sel':'');it.dataset.m=x.id;it.innerHTML='<span class="mAva '+x.cls+'">'+x.icon+'</span><span class="mInfo"><div class="mName">'+x.tag+'</div><div class="mDesc">'+x.desc+'</div></span>';mDrop.appendChild(it)});mDrop.classList.add('open')}
function closeDrop(){mDrop.classList.remove('open');mDrop.innerHTML='';dropSel=-1}
function checkMention(){if(composing)return;const caret=typeof mInput.selectionStart==='number'?mInput.selectionStart:mInput.value.length;const tok=curToken(mInput.value.slice(0,caret));if(!tok){closeDrop();return}const q=tok.slice(1).toLowerCase();const list=MENTIONS.filter(m=>!q||m.tag.toLowerCase().includes(q)||m.id.includes(q));if(!list.length){closeDrop();return}mDrop.style.bottom='calc(100% + 8px)';mDrop.style.top='auto';dropSel=0;renderDrop(list)}
function applyMention(id){const x=MENTIONS.find(m=>m.id===id);if(!x)return;const v=mInput.value;const at=v.lastIndexOf('@');if(at<0)return;mInput.value=v.slice(0,at)+'@'+x.tag+' ';closeDrop();mInput.focus()}
mInput.addEventListener('compositionstart',()=>{composing=true});
mInput.addEventListener('compositionend',()=>{composing=false;checkMention()});
mInput.addEventListener('input',checkMention);
mInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&mDrop.classList.contains('open')){e.preventDefault();const s=mDrop.querySelector('.mItem.sel');if(s)applyMention(s.dataset.m);return}if(!mDrop.classList.contains('open'))return;const items=mDrop.querySelectorAll('.mItem');if(!items.length)return;if(e.key==='ArrowDown'){e.preventDefault();dropSel=(dropSel+1)%items.length}else if(e.key==='ArrowUp'){e.preventDefault();dropSel=(dropSel-1+items.length)%items.length}else if(e.key==='Escape'){closeDrop();return}items.forEach((it,i)=>it.classList.toggle('sel',i===dropSel))});
mDrop.addEventListener('mousedown',e=>{e.preventDefault();const it=e.target.closest('.mItem');if(it)applyMention(it.dataset.m)});
document.addEventListener('click',e=>{if(!e.target.closest('.mWrap'))closeDrop()});
function renderContent(t){return (t||'').replace(/@(?:GPT|Ziven|all)\b/g,function(m){var c=m.toLowerCase();return '<span class="mBadge '+(c==='@gpt'?'gpt':c==='@ziven'?'ziv':'all')+'">'+m+'</span>'})}
async function createThread(){const title=prompt('讨论标题？','未命名话题');if(title===null)return;const clean=title.trim()||'未命名话题';try{notice('');const data=await api(API.threads,{method:'POST',body:JSON.stringify({title:clean,creator:'liuliu'})});const t=data?.thread||data?.data||data;const id=threadId(t);if(!id)throw new Error('服务端没有返回 thread_id');currentThread=null;await loadThreads(false);await selectThread(id,t);afterThreadNavigate()}catch(e){console.error(e);notice('创建 Thread 失败：'+e.message)}}
async function sendMessage(){if(!currentThread)return;const input=requireElement('input');const content=input.value.trim();if(!content)return;const send=document.querySelector('#composer .send');if(!send)throw new Error('Missing element: composer .send');send.disabled=true;input.disabled=true;notice('');try{const body={author:'liuliu',content,mentions:parseMentions(content)};await api(API.messages(currentThread),{method:'POST',body:JSON.stringify(body)});input.value='';appendMessages([{author:'liuliu',content,created_at:new Date().toISOString(),message_id:'local-'+Date.now()}]);pollMessages()}catch(e){console.error(e);notice('发送失败：'+e.message)}finally{input.disabled=false;if(send)send.disabled=false;input.focus()}}
function openThreads(){const s=document.querySelector('.sidebar');if(s)s.classList.add('open');const o=document.getElementById('overlay');if(o)o.classList.add('show')}
function closeThreads(){const s=document.querySelector('.sidebar');if(s)s.classList.remove('open');const o=document.getElementById('overlay');if(o)o.classList.remove('show')}
requireElement('threadToggle').addEventListener('click',openThreads);
requireElement('overlay').addEventListener('click',closeThreads);
requireElement('newThread').addEventListener('click',createThread);
requireElement('composer').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
requireElement('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
loadThreads();
