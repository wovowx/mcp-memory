<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Ground</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--line:#2a3654;--text:#edf2ff;--muted:#8f9bb5;--accent:#8fa8ff;--user:#263657;--agent:#1a2940}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 20% 0%,#17213c 0,#0b1020 42%);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid var(--line);background:rgba(10,15,29,.82);padding:18px;display:flex;flex-direction:column;min-width:0}.brand{font-size:20px;font-weight:700;margin-bottom:16px}.new{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}.new:hover{background:var(--panel2)}.threads{margin-top:14px;overflow:auto}.thread{padding:11px 12px;border-radius:9px;margin-bottom:5px;cursor:pointer;color:#cbd4ea}.thread:hover{background:rgba(24,34,58,.7)}.thread.active{background:var(--panel2);color:#fff}.thread small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:rgba(11,16,32,.5)}.header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.title{font-weight:650}.status{font-size:12px;color:var(--muted)}.messages{padding:22px;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;color:var(--muted);text-align:center}.msg{max-width:min(760px,88%);padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--agent)}.msg.user{align-self:flex-end;background:var(--user)}.meta{font-size:12px;color:var(--muted);margin-bottom:5px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.reply{font-size:11px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin-bottom:7px}.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;background:rgba(10,15,29,.9);flex-shrink:0;max-height:40vh}textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;outline:none;overflow:auto}textarea:focus{border-color:var(--accent)}button.send{border:0;border-radius:10px;background:var(--accent);color:#081022;padding:0 18px;font-weight:700;cursor:pointer;align-self:flex-end}button:disabled{opacity:.5;cursor:not-allowed}.notice{padding:10px 18px;color:#f0c98a;font-size:12px;display:none;border-top:1px solid var(--line);flex-shrink:0}
.mobile-header{display:none;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(10,15,29,.9);position:sticky;top:0;z-index:30;flex-shrink:0}.mobile-header .burger{background:none;border:0;color:var(--text);font-size:22px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px;touch-action:manipulation}.mobile-header .m-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolcalls{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.toolcard{border:1px solid var(--line);border-radius:9px;background:rgba(14,20,38,.7);overflow:hidden}.toolcard summary{cursor:pointer;padding:8px 12px;font-size:13px;color:#cbd4ea;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}.toolcard summary::-webkit-details-marker{display:none}.toolcard summary:before{content:'\25b8';margin-right:4px;color:var(--muted);transition:transform .15s}.toolcard[open] summary:before{transform:rotate(90deg)}.toolbody{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.toolarg{white-space:pre-wrap;overflow-wrap:anywhere}.toolres{color:#a8d5a2;white-space:pre-wrap;overflow-wrap:anywhere}.toolerr{color:#f0a0a0;white-space:pre-wrap;overflow-wrap:anywhere}
.overlay{display:none}
@media(max-width:720px){
.app{grid-template-columns:1fr}.sidebar{position:fixed;top:0;bottom:0;left:-280px;width:280px;z-index:20;transition:left .2s}.sidebar.open{left:0}.mobile-header{display:flex}.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:10}.messages{padding:14px}.main .header{display:none}.composer{padding:10px}
}
</style>
</head>
<body>
<div class="mobile-header"><button class="burger" id="threadToggle" type="button" aria-label="打开讨论列表">☰</button><span class="m-title" id="mobileTitle">Common Ground</span></div>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar">
<div class="brand">Common Ground</div>
<button class="new" id="newThread" type="button">＋ 新讨论</button>
<div class="threads" id="threads"><div class="empty">加载中…</div></div>
</aside>
<main class="main">
<header class="header"><div class="title" id="threadTitle">选择一个讨论</div><div class="status" id="status">MVP</div></header>
<section class="messages" id="messages"><div class="empty">选择或新建一个 Thread</div></section>
<div class="notice" id="notice"></div>
<form class="composer" id="composer">
<textarea id="input" placeholder="输入消息… 支持 @GPT / @Ziven / @all" disabled></textarea>
<button class="send" type="submit" disabled>发送</button>
</form>
</main>
</div>
<script>
'use strict';
const API={
  threads:'/api/chat/threads',
  messages:id=>`/api/chat/threads/${encodeURIComponent(id)}/messages`
};
let currentThread=null;
// v2.5 实时轮询：5s 间隔 + polling 锁防并发 + message_id 去重增量追加
const POLL_MS=5000;
let polling=false;
let renderedIds=new Set();
const $=id=>document.getElementById(id);
function requireElement(id){const el=document.getElementById(id);if(!el)throw new Error('Missing element: '+id);return el}
function notice(text){const n=$('notice');n.textContent=text;n.style.display=text?'block':'none'}
async function api(url,options={}){
  const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
  const text=await r.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error(`${r.status} ${typeof data==='string'?data:JSON.stringify(data)}`);
  return data;
}
function normalizeList(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.threads))return data.threads;
  if(data&&Array.isArray(data.data))return data.data;
  return [];
}
function normalizeMessages(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.messages))return data.messages;
  if(data&&Array.isArray(data.data))return data.data;
  return [];
}
function threadId(t){return t.thread_id||t.id}
function isMobile(){return window.innerWidth<=720}
function afterThreadNavigate(){if(isMobile())closeThreads()}
function renderThreads(items){
  const box=$('threads');box.innerHTML='';
  if(!items.length){box.innerHTML='<div class="empty">还没有讨论</div>';return}
  for(const t of items){
    const id=threadId(t);if(!id)continue;
    const el=document.createElement('div');el.className='thread'+(String(id)===String(currentThread)?' active':'');el.dataset.id=id;
    const title=document.createElement('div');title.textContent=t.title||'未命名话题';
    const small=document.createElement('small');small.textContent=t.status||'active';
    el.append(title,small);el.addEventListener('click',()=>{selectThread(id,t);afterThreadNavigate()});box.appendChild(el);
  }
}
async function loadThreads(selectFirst=true){
  try{notice('');const data=await api(API.threads);const list=normalizeList(data);renderThreads(list);
    if(selectFirst&&list.length&&!currentThread)await selectThread(threadId(list[0]),list[0]);
  }catch(e){console.error(e);notice('加载 Thread 失败：'+e.message)}
}
async function selectThread(id,thread){
  currentThread=id;requireElement('threadTitle').textContent=thread?.title||'未命名话题';requireElement('mobileTitle').textContent=thread?.title||'未命名话题';requireElement('input').disabled=false;const sendBtn=document.querySelector('#composer .send');if(sendBtn)sendBtn.disabled=false;
  renderThreads(normalizeListFromDom());
  requireElement('messages').innerHTML='<div class="empty">加载消息中…</div>';
  try{const data=await api(API.messages(id));renderMessages(normalizeMessages(data))}catch(e){console.error(e);requireElement('messages').innerHTML='<div class="empty">加载消息失败</div>';notice('加载消息失败：'+e.message)}
}
function normalizeListFromDom(){
  return [...document.querySelectorAll('.thread')].map(el=>({thread_id:el.dataset.id,title:el.querySelector('div')?.textContent,status:el.querySelector('small')?.textContent}));
}
// v2.5: 消息元素统一构建（renderMessages 与 appendMessages 共用）
function buildMessageEl(m){
  const el=document.createElement('article');el.className='msg'+(m.author==='liuliu'?' user':'');
  const meta=document.createElement('div');meta.className='meta';meta.textContent=`${m.author||'unknown'} · ${formatTime(m.created_at)}`;
  if(m.reply_to){const reply=document.createElement('div');reply.className='reply';reply.textContent='回复：'+m.reply_to;el.appendChild(reply)}
  if(m.tool_calls&&Array.isArray(m.tool_calls)){el.appendChild(renderToolCalls(m.tool_calls))}
  const content=document.createElement('div');content.className='content';content.textContent=cleanContent(m.content||'');el.append(meta,content);
  return el;
}
function renderMessages(items){
  const box=$('messages');box.innerHTML='';renderedIds.clear();
  if(!items.length){box.innerHTML='<div class="empty">这个讨论还没有消息</div>';return}
  for(const m of items){
    if(m.message_id||m.id)renderedIds.add(m.message_id||m.id);
    box.appendChild(buildMessageEl(m));
  }
  box.scrollTop=box.scrollHeight;
}
// v2.5: 增量追加（对比 message_id 去重；用户不在底部时不强制滚动）
function isNearBottom(box,threshold=80){
  return box.scrollHeight - box.scrollTop - box.clientHeight < threshold;
}
function appendMessages(items){
  if(!items.length)return;
  const box=$('messages');
  const empty=box.querySelector('.empty');if(empty)empty.remove();
  const followScroll=isNearBottom(box);
  let added=false;
  for(const m of items){
    const mid=m.message_id||m.id;
    if(mid&&renderedIds.has(mid))continue;
    if(mid)renderedIds.add(mid);
    box.appendChild(buildMessageEl(m));added=true;
  }
  if(added&&followScroll)box.scrollTop=box.scrollHeight;
}
// v2.5: 实时轮询（polling 锁防并发；静默失败不打扰）
async function pollMessages(){
  if(!currentThread||polling)return;
  polling=true;
  try{
    const data=await api(API.messages(currentThread));
    appendMessages(normalizeMessages(data));
  }catch(e){/* 静默：避免频繁失败弹错误 */}
  finally{polling=false;}
}
function formatTime(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function cleanContent(text){
  if(!text)return '';
  // 剥离 ⚠message_reaction⚠...⚠ 整段（GPT App 里是 reaction，不是正文）
  // 再剔除其他 ⚠xxx⚠ 元数据标记
  return text.replace(/\u26a0message_reaction\u26a0.*?\u26a0/gs,'')
    .replace(/\u26a0[^\u26a0]*\u26a0/g,'')
    .trim();
}
function renderToolCalls(tools){
  const wrap=document.createElement('div');wrap.className='toolcalls';
  for(const t of tools){
    const card=document.createElement('details');card.className='toolcard';
    const sum=document.createElement('summary');
    const status=t.status==='success'?'✅':(t.status==='failed'?'❌':(t.status==='running'?'⏳':'🔧'));
    sum.textContent=`${status} ${t.tool_name||'tool'}`;
    const body=document.createElement('div');body.className='toolbody';
    if(t.arguments){const a=document.createElement('div');a.className='toolarg';a.textContent='参数: '+JSON.stringify(t.arguments);body.appendChild(a)}
    if(t.result!=null){const r=document.createElement('div');r.className='toolres';r.textContent='结果: '+ (typeof t.result==='string'?t.result:JSON.stringify(t.result));body.appendChild(r)}
    if(t.error){const e=document.createElement('div');e.className='toolerr';e.textContent='错误: '+t.error;body.appendChild(e)}
    card.append(sum,body);wrap.appendChild(card);
  }
  return wrap;
}
function parseMentions(content){
  const result=[];
  if(/@all\b/i.test(content))result.push('gpt','ziven');
  if(/@GPT\b/i.test(content)&&!result.includes('gpt'))result.push('gpt');
  if(/@Ziven\b/i.test(content)&&!result.includes('ziven'))result.push('ziven');
  return result;
}
async function createThread(){
  const title=prompt('讨论标题？','未命名话题');
  if(title===null)return;
  const clean=title.trim()||'未命名话题';
  try{
    notice('');
    const data=await api(API.threads,{method:'POST',body:JSON.stringify({title:clean,creator:'liuliu'})});
    const t=data?.thread||data?.data||data;const id=threadId(t);
    if(!id)throw new Error('服务端没有返回 thread_id');
    currentThread=null;await loadThreads(false);await selectThread(id,t);afterThreadNavigate();
  }catch(e){console.error(e);notice('创建 Thread 失败：'+e.message)}
}
async function sendMessage(){
  if(!currentThread)return;
  const input=requireElement('input');const content=input.value.trim();if(!content)return;
  const send=document.querySelector('#composer .send');if(!send)throw new Error('Missing element: composer .send');send.disabled=true;input.disabled=true;notice('');
  try{
    const body={author:'liuliu',content,mentions:parseMentions(content)};
    await api(API.messages(currentThread),{method:'POST',body:JSON.stringify(body)});
    input.value='';await selectThread(currentThread,{title:$('threadTitle').textContent});
  }catch(e){console.error(e);notice('发送失败：'+e.message)}
  finally{input.disabled=false;if(send)send.disabled=false;input.focus()}
}
function openThreads(){
  const s=document.querySelector('.sidebar');if(s)s.classList.add('open');
  const o=document.getElementById('overlay');if(o)o.classList.add('show');
}
function closeThreads(){
  const s=document.querySelector('.sidebar');if(s)s.classList.remove('open');
  const o=document.getElementById('overlay');if(o)o.classList.remove('show');
}
requireElement('threadToggle').addEventListener('click',openThreads);
requireElement('overlay').addEventListener('click',closeThreads);
requireElement('newThread').addEventListener('click',createThread);
requireElement('composer').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
requireElement('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
loadThreads();
setInterval(pollMessages,POLL_MS);
</script>
</body>
</html>
