<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Ground</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--line:#2a3654;--text:#edf2ff;--muted:#8f9bb5;--accent:#8fa8ff;--user:#263657;--agent:#1a2940}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17213c 0,#0b1020 42%);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid var(--line);background:rgba(10,15,29,.82);padding:18px;display:flex;flex-direction:column;min-width:0}.brand{font-size:20px;font-weight:700;margin-bottom:16px}.new{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}.threads{margin-top:14px;overflow:auto}.thread{padding:11px 12px;border-radius:9px;margin-bottom:5px;cursor:pointer;color:#cbd4ea}.thread.active{background:var(--panel2);color:#fff}.thread small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;display:grid;grid-template-rows:auto 1fr auto;background:rgba(11,16,32,.5)}.header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.title{font-weight:650}.status{font-size:12px;color:var(--muted)}.messages{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;color:var(--muted);text-align:center}.msg{max-width:min(760px,88%);padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--agent)}.msg.user{align-self:flex-end;background:var(--user)}.meta{font-size:12px;color:var(--muted);margin-bottom:5px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.reply{font-size:11px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin-bottom:7px}.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;background:rgba(10,15,29,.9)}textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;outline:none}button.send{border:0;border-radius:10px;background:var(--accent);color:#081022;padding:0 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.notice{padding:10px 18px;color:#f0c98a;font-size:12px;display:none;border-top:1px solid var(--line)}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:14px}.header{padding:14px}.composer{padding:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Common Ground</div><button class="new" id="newThread">＋ 新讨论</button><div class="threads" id="threads"><div class="empty">加载中…</div></div></aside>
<main class="main"><header class="header"><div class="title" id="threadTitle">选择一个讨论</div><div class="status" id="status">MVP</div></header><section class="messages" id="messages"><div class="empty">选择或新建一个 Thread</div></section><div class="notice" id="notice"></div><form class="composer" id="composer"><textarea id="input" placeholder="输入消息… 支持 @GPT / @Ziven / @all" disabled></textarea><button class="send" type="submit" disabled>发送</button></form></main>
</div>
<script>
const API={threads:'/api/chat/threads',messages:id=>`/api/chat/threads/${encodeURIComponent(id)}/messages`};
let currentThread=null;
const $=id=>document.getElementById(id);
function notice(text){const n=$('notice');n.textContent=text;n.style.display=text?'block':'none'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.status===204?null:r.json()}
function actorName(a){return ({liuliu:'柳',gpt:'GPT',ziven:'Ziven'})[a]||a}
function renderThreads(items){const box=$('threads');box.innerHTML='';if(!items?.length){box.innerHTML='<div class="empty">还没有讨论</div>';return}for(const t of items){const el=document.createElement('div');el.className='thread'+(t.thread_id===currentThread?' active':'');el.innerHTML=`<div>${escapeHtml(t.title||'未命名话题')}</div><small>${t.status||'active'}</small>`;el.onclick=()=>selectThread(t.thread_id,t.title);box.appendChild(el)}}
function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function renderMessages(items){const box=$('messages');box.innerHTML='';if(!items?.length){box.innerHTML='<div class="empty">这个讨论还没有消息</div>';return}for(const m of items){const el=document.createElement('article');el.className='msg'+(m.author==='liuliu'?' user':'');const reply=m.reply_to?`<div class="reply">回复：${escapeHtml(String(m.reply_to).slice(0,8))}…</div>`:'';el.innerHTML=`${reply}<div class="meta">${escapeHtml(actorName(m.author))} · ${new Date(m.created_at).toLocaleString()}</div><div class="content">${escapeHtml(m.content)}</div>`;box.appendChild(el)}box.scrollTop=box.scrollHeight}
async function loadThreads(){try{const data=await api(API.threads);const items=Array.isArray(data)?data:(data.threads||data.data||[]);renderThreads(items);if(!currentThread&&items[0])selectThread(items[0].thread_id,items[0].title)}catch(e){notice('Thread 加载失败：'+e.message)}}
async function selectThread(id,title){currentThread=id;$('threadTitle').textContent=title||'未命名话题';$('input').disabled=false;$('composer button').disabled=false;loadThreads().catch(()=>{});try{const data=await api(API.messages(id));const items=Array.isArray(data)?data:(data.messages||data.data||[]);renderMessages(items);notice('')}catch(e){renderMessages([]);notice('消息加载失败：'+e.message)}}
$('newThread').onclick=async()=>{const title=prompt('讨论标题？','新讨论');if(title===null)return;try{const t=await api(API.threads,{method:'POST',body:JSON.stringify({title:title.trim()||'未命名话题',creator:'liuliu'})});await loadThreads();selectThread(t.thread_id,t.title)}catch(e){notice('创建 Thread 失败：'+e.message)}};
$('composer').onsubmit=async e=>{e.preventDefault();if(!currentThread)return;const input=$('input');const content=input.value.trim();if(!content)return;input.disabled=true;$('composer button').disabled=true;try{await api(API.messages(currentThread),{method:'POST',body:JSON.stringify({author:'liuliu',content})});input.value='';await selectThread(currentThread,$('threadTitle').textContent)}catch(e){notice('发送失败：'+e.message)}finally{input.disabled=false;$('composer button').disabled=false;input.focus()}};
loadThreads();
</script>
</body>
</html>
