<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆宇宙</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Great Vibes', cursive; }
#container { width:100%; height:100%; position:relative; }
#header {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:20px 24px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none;
}
#title {
    font-size:24px; font-weight:400; letter-spacing:4px;
    color:rgba(255,255,255,0.45);
}
#title span {
    display:inline-block;
    transition:color 0.8s ease, text-shadow 0.8s ease;
    color:rgba(255,255,255,0.45);
}
#title span.bright {
    color:rgba(255,255,255,0.9);
    text-shadow:0 0 12px rgba(180,200,255,0.9), 0 0 30px rgba(140,170,255,0.5);
}
#toggleBtn {
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0.55;
    transition:opacity 0.3s, transform 0.3s;
    background:none; border:none; padding:0;
    pointer-events:auto;
}
#toggleBtn:hover { opacity:1; transform:scale(1.1); }
#toggleBtn svg { width:22px; height:22px; stroke:rgba(255,255,255,0.6); fill:none; stroke-width:1.5; }
#toggleBtn .star-svg path { stroke:inherit; fill:none; }
#toggleBtn .rain-svg { display:none; }
#loading {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000; transition:opacity 0.8s;
}
#loading.hidden { opacity:0; pointer-events:none; }
.loading-dot {
    width:8px; height:8px; border-radius:50%;
    background:#fff; animation:pulse 1.5s infinite;
    box-shadow:0 0 30px #aac4ff, 0 0 60px #6688ff;
}
@keyframes pulse { 0%,100% { opacity:0.5; transform:scale(0.8);} 50% { opacity:1; transform:scale(1.3);} }
</style>
</head>
<body>
<div id="container"></div>
<div id="header">
    <div id="title"></div>
    <button id="toggleBtn" title="切换星空/雨幕">
        <svg class="star-svg" viewBox="0 0 24 24" width="36" height="36">
            <path d="M12 2l2.5 5.1 5.6.8-4 3.9.9 5.6-5.1-2.5-5.1 2.5.9-5.6-4-3.9 5.6-.8z"/>
        </svg>
        <svg class="rain-svg" viewBox="0 0 24 24">
            <path d="M6.5 16.5c-2.5 0-4.5-1.8-4.5-4s1.8-4 4-4.2c.5-2.5 2.8-4.3 5.3-4.3 2.8 0 5.2 2.1 5.5 5 2.3.5 4 2.5 4 4.8 0 2.8-2.2 5-5 5h-9.3z"/>
            <line x1="8" y1="19" x2="7" y2="22"/>
            <line x1="12" y1="19" x2="11" y2="22"/>
            <line x1="16" y1="19" x2="15" y2="22"/>
        </svg>
    </button>
</div>
<div id="loading"><div class="loading-dot"></div></div>

<script>
// ===== 先隐藏loading，保证页面主体可见（不依赖网络）=====
(function () {
    var ld = document.getElementById('loading');
    if (ld) ld.classList.add('hidden');
})();

// ===== 标题动画 =====
(function () {
    var titleEl = document.getElementById('title');
    var titleText = 'Liuliu & Ziven';
    titleEl.innerHTML = '';
    titleText.split('').forEach(function (ch, i) {
        var sp = document.createElement('span');
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        titleEl.appendChild(sp);
    });
    var spans = titleEl.querySelectorAll('span');
    spans.forEach(function (sp, i) { setTimeout(function () { sp.classList.add('bright'); }, i * 300); });
    setTimeout(function () {
        spans.forEach(function (sp) { sp.style.color = 'rgba(200,220,255,0.9)'; sp.style.textShadow = '0 0 14px rgba(180,200,255,0.8), 0 0 30px rgba(140,170,255,0.4)'; });
        setTimeout(function () {
            spans.forEach(function (sp) { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; });
            setTimeout(function () {
                spans.forEach(function (sp) { sp.style.color = 'rgba(220,200,255,0.9)'; sp.style.textShadow = '0 0 14px rgba(200,180,255,0.8), 0 0 30px rgba(160,140,255,0.4)'; });
                setTimeout(function () {
                    spans.forEach(function (sp) { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; });
                    setTimeout(function () {
                        function flash() {
                            var count = 2 + Math.floor(Math.random() * 3);
                            var iter = 0;
                            var colors = [
                                { color: 'rgba(255,255,255,0.9)', shadow: '0 0 12px rgba(180,200,255,0.9), 0 0 30px rgba(140,170,255,0.5)' },
                                { color: 'rgba(200,220,255,0.9)', shadow: '0 0 14px rgba(180,200,255,0.8), 0 0 30px rgba(140,170,255,0.4)' },
                                { color: 'rgba(220,200,255,0.9)', shadow: '0 0 14px rgba(200,180,255,0.8), 0 0 30px rgba(160,140,255,0.4)' },
                            ];
                            var interval = setInterval(function () {
                                spans.forEach(function (sp) {
                                    var bright = Math.random() > 0.5;
                                    if (bright) { var c = colors[Math.floor(Math.random() * colors.length)]; sp.style.color = c.color; sp.style.textShadow = c.shadow; }
                                    else { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; }
                                });
                                iter++; if (iter >= count) clearInterval(interval);
                            }, 1200 + Math.random() * 600);
                        }
                        flash();
                        setInterval(flash, 4000 + Math.random() * 2000);
                    }, 1000);
                }, 1200);
            }, 800);
        }, 1200);
    }, 1500);
})();

// ===== 切换按钮 =====
var isRainMode = false;
var toggleBtn = document.getElementById('toggleBtn');
var starSvg = toggleBtn.querySelector('.star-svg');
var rainSvg = toggleBtn.querySelector('.rain-svg');
toggleBtn.addEventListener('click', function () {
    isRainMode = !isRainMode;
    starSvg.style.display = isRainMode ? 'none' : 'block';
    rainSvg.style.display = isRainMode ? 'block' : 'none';
});

// ===== Three.js 动态加载（避免CDN阻塞页面渲染）=====
function loadScript(src, onOk, onErr) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = onOk;
    s.onerror = onErr || function () { console.error('Failed to load ' + src); };
    document.head.appendChild(s);
}

loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function () {
    // 3D全部放这里；加载失败页面也正常显示标题
    try {
        var container = document.getElementById('container');
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';  // 关键！防止浏览器抢触摸滚动
        container.appendChild(renderer.domElement);

        // 相机轨道参数（后续所有层共用）
        var camRadius = 100;
        var camTheta = 0;   // 水平角：初始朝正Z方向（背景星在负Z，正好在前方）
        var camPhi = 0;     // 垂直角
        function updateCamera() {
            var sp = Math.sin(Math.PI / 2 - camPhi);
            camera.position.set(
                camRadius * sp * Math.sin(camTheta),
                camRadius * Math.cos(Math.PI / 2 - camPhi),
                camRadius * sp * Math.cos(camTheta)
            );
            camera.lookAt(0, 0, 0);
        }
        updateCamera();

        // 拖拽旋转相机（带惯性滑动）
        var dragging = false, lastX = 0, lastY = 0, lastTime = 0;
        var velTheta = 0, velPhi = 0;   // 角速度（惯性）
        var inertiaId = null;

        function stopInertia() {
            if (inertiaId) { cancelAnimationFrame(inertiaId); inertiaId = null; }
        }
        function startInertia() {
            stopInertia();
            var last = performance.now();
            function step(now) {
                var dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                // 阻尼衰减，慢慢停下来
                var decay = Math.pow(0.92, dt * 60);
                velTheta *= decay;
                velPhi *= decay;
                camTheta += velTheta * dt;
                camPhi += velPhi * dt;
                camPhi = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, camPhi));
                updateCamera();
                if (Math.abs(velTheta) < 0.0005 && Math.abs(velPhi) < 0.0005) { inertiaId = null; return; }
                inertiaId = requestAnimationFrame(step);
            }
            inertiaId = requestAnimationFrame(step);
        }

        renderer.domElement.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            lastTime = performance.now();
            stopInertia();
            velTheta = 0; velPhi = 0;
        }, { passive: false });
        window.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            e.preventDefault();
            var now = performance.now();
            var dt = Math.max(0.001, (now - lastTime) / 1000);
            lastTime = now;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            // 移动角度 + 记录速度（用于松手后的惯性）
            camTheta -= dx * 0.005;
            camPhi -= dy * 0.005;
            camPhi = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, camPhi));
            velTheta = -dx * 0.005 / dt;
            velPhi = -dy * 0.005 / dt;
            lastX = e.clientX; lastY = e.clientY;
            updateCamera();
        }, { passive: false });
        window.addEventListener('pointerup', function () {
            if (!dragging) return;
            dragging = false;
            startInertia();
        });

        // 滚轮缩放
        renderer.domElement.addEventListener('wheel', function (e) {
            e.preventDefault();
            camRadius *= e.deltaY > 0 ? 1.06 : 0.94;
            camRadius = Math.max(40, Math.min(260, camRadius));
            updateCamera();
        }, { passive: false });

        // 背景星空层：9000颗，球壳分布（360°全覆盖，往哪滑都有星星），白微蓝，双层闪烁
        var BG_COUNT = 9000;
        var bgGeo = new THREE.BufferGeometry();
        var bgPos = new Float32Array(BG_COUNT * 3);
        var bgSize = new Float32Array(BG_COUNT);
        var bgRand = new Float32Array(BG_COUNT);
        for (var i = 0; i < BG_COUNT; i++) {
            // 球壳分布：任意方向都有星星，相机永远被星空包围
            var theta = Math.random() * Math.PI * 2;
            var phi = Math.acos(2 * Math.random() - 1);
            var r = 450 + Math.random() * 150;
            bgPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            bgPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            bgPos[i * 3 + 2] = r * Math.cos(phi);
            bgSize[i] = 0.8 + Math.random() * 2.6;
            bgRand[i] = Math.random() * Math.PI * 2;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        bgGeo.setAttribute('aSize', new THREE.BufferAttribute(bgSize, 1));
        bgGeo.setAttribute('aRand', new THREE.BufferAttribute(bgRand, 1));

        var bgMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0.95, 0.98, 1.0) },
                uPixelRatio: { value: renderer.getPixelRatio() }
            },
            vertexShader: [
                'attribute float aSize;',
                'attribute float aRand;',
                'uniform float uTime;',
                'uniform float uPixelRatio;',
                'varying float vTwinkle;',
                'void main() {',
                '    vec4 mv = modelViewMatrix * vec4(position, 1.0);',
                '    float t = uTime * 1.2;',
                '    float tw1 = sin(t + aRand * 6.2831);',
                '    float tw2 = sin(t * 1.7 + aRand * 12.5662);',
                '    vTwinkle = 0.65 + 0.35 * (tw1 * 0.6 + tw2 * 0.4);',
                '    gl_PointSize = aSize * uPixelRatio * (620.0 / max(1.0, -mv.z));',
                '    gl_Position = projectionMatrix * mv;',
                '}'
            ].join('\n'),
            fragmentShader: [
                'uniform vec3 uColor;',
                'varying float vTwinkle;',
                'void main() {',
                '    vec2 uv = gl_PointCoord - 0.5;',
                '    float d = length(uv);',
                '    if (d > 0.5) discard;',
                '    float core = smoothstep(0.30, 0.0, d);',
                '    float glow = smoothstep(0.5, 0.03, d);',
                '    vec3 col = uColor * (0.9 + 1.5 * core);',
                '    float alpha = (0.7 * glow + 1.0 * core) * vTwinkle;',
                '    gl_FragColor = vec4(col, alpha);',
                '}'
            ].join('\n'),
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        var bgStars = new THREE.Points(bgGeo, bgMat);
        scene.add(bgStars); // 固定scene根节点，不加group

        // 动画循环
        var clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            bgMat.uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口变化
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    } catch (err) {
        console.error('3D init failed:', err);
    }
});
</script>
</body>
</html>
