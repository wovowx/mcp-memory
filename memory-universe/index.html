<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆宇宙</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Great Vibes', cursive; }
#container { width:100%; height:100%; position:relative; }
#header {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:20px 24px;
    display:flex; align-items:center; justify-content:space-between;
    pointer-events:none;
}
#title {
    font-size:24px; font-weight:400; letter-spacing:4px;
    color:rgba(255,255,255,0.45);
}
#title span {
    display:inline-block;
    transition:color 0.8s ease, text-shadow 0.8s ease;
    color:rgba(255,255,255,0.45);
}
#title span.bright {
    color:rgba(255,255,255,0.9);
    text-shadow:0 0 12px rgba(180,200,255,0.9), 0 0 30px rgba(140,170,255,0.5);
}
#toggleBtn {
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0.55;
    transition:opacity 0.3s, transform 0.3s;
    background:none; border:none; padding:0;
    pointer-events:auto;
}
#toggleBtn:hover { opacity:1; transform:scale(1.1); }
#toggleBtn svg { width:22px; height:22px; stroke:rgba(255,255,255,0.6); fill:none; stroke-width:1.5; }
#toggleBtn .star-svg path { stroke:inherit; fill:none; }
#toggleBtn .rain-svg { display:none; }
#loading {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000; transition:opacity 0.8s;
}
#loading.hidden { opacity:0; pointer-events:none; }
.loading-dot {
    width:8px; height:8px; border-radius:50%;
    background:#fff; animation:pulse 1.5s infinite;
    box-shadow:0 0 30px #aac4ff, 0 0 60px #6688ff;
}
@keyframes pulse { 0%,100% { opacity:0.5; transform:scale(0.8);} 50% { opacity:1; transform:scale(1.3);} }
</style>
</head>
<body>
<div id="container"></div>
<div id="header">
    <div id="title"></div>
    <button id="toggleBtn" title="切换星空/雨幕">
        <svg class="star-svg" viewBox="0 0 24 24" width="36" height="36">
            <path d="M12 2l2.5 5.1 5.6.8-4 3.9.9 5.6-5.1-2.5-5.1 2.5.9-5.6-4-3.9 5.6-.8z"/>
        </svg>
        <svg class="rain-svg" viewBox="0 0 24 24">
            <path d="M6.5 16.5c-2.5 0-4.5-1.8-4.5-4s1.8-4 4-4.2c.5-2.5 2.8-4.3 5.3-4.3 2.8 0 5.2 2.1 5.5 5 2.3.5 4 2.5 4 4.8 0 2.8-2.2 5-5 5h-9.3z"/>
            <line x1="8" y1="19" x2="7" y2="22"/>
            <line x1="12" y1="19" x2="11" y2="22"/>
            <line x1="16" y1="19" x2="15" y2="22"/>
        </svg>
    </button>
</div>
<div id="loading"><div class="loading-dot"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 标题动画
const titleEl = document.getElementById('title');
const titleText = 'Liuliu & Ziven';
titleEl.innerHTML = '';
titleText.split('').forEach((ch, i) => {
    const sp = document.createElement('span');
    sp.textContent = ch === ' ' ? '\u00A0' : ch;
    titleEl.appendChild(sp);
});
const spans = titleEl.querySelectorAll('span');
spans.forEach((sp, i) => { setTimeout(() => sp.classList.add('bright'), i * 300); });
setTimeout(() => {
    spans.forEach(sp => { sp.style.color = 'rgba(200,220,255,0.9)'; sp.style.textShadow = '0 0 14px rgba(180,200,255,0.8), 0 0 30px rgba(140,170,255,0.4)'; });
    setTimeout(() => {
        spans.forEach(sp => { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; });
        setTimeout(() => {
            spans.forEach(sp => { sp.style.color = 'rgba(220,200,255,0.9)'; sp.style.textShadow = '0 0 14px rgba(200,180,255,0.8), 0 0 30px rgba(160,140,255,0.4)'; });
            setTimeout(() => {
                spans.forEach(sp => { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; });
                setTimeout(() => {
                    function flash() {
                        const count = 2 + Math.floor(Math.random() * 3);
                        let iter = 0;
                        const colors = [
                            { color: 'rgba(255,255,255,0.9)', shadow: '0 0 12px rgba(180,200,255,0.9), 0 0 30px rgba(140,170,255,0.5)' },
                            { color: 'rgba(200,220,255,0.9)', shadow: '0 0 14px rgba(180,200,255,0.8), 0 0 30px rgba(140,170,255,0.4)' },
                            { color: 'rgba(220,200,255,0.9)', shadow: '0 0 14px rgba(200,180,255,0.8), 0 0 30px rgba(160,140,255,0.4)' },
                        ];
                        const interval = setInterval(() => {
                            spans.forEach(sp => {
                                const bright = Math.random() > 0.5;
                                if (bright) { const c = colors[Math.floor(Math.random() * colors.length)]; sp.style.color = c.color; sp.style.textShadow = c.shadow; }
                                else { sp.style.color = 'rgba(255,255,255,0.45)'; sp.style.textShadow = 'none'; }
                            });
                            iter++; if (iter >= count) clearInterval(interval);
                        }, 1200 + Math.random() * 600);
                    }
                    flash();
                    setInterval(flash, 4000 + Math.random() * 2000);
                }, 1000);
            }, 1200);
        }, 800);
    }, 1200);
}, 1500);

// 切换按钮
let isRainMode = false;
const toggleBtn = document.getElementById('toggleBtn');
const starSvg = toggleBtn.querySelector('.star-svg');
const rainSvg = toggleBtn.querySelector('.rain-svg');
toggleBtn.addEventListener('click', () => {
    isRainMode = !isRainMode;
    starSvg.style.display = isRainMode ? 'none' : 'block';
    rainSvg.style.display = isRainMode ? 'block' : 'none';
});
</script>
</body>
</html>
