.loading-star { width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.5s infinite; box-shadow:0 0 30px #aac4ff, 0 0 60px #6688ff; }
@keyframes pulse { 0%,100% { opacity:0.5; transform:scale(0.8);} 50% { opacity:1; transform:scale(1.3);} }
#loading p { color:rgba(255,255,255,0.8); margin-top:16px; font-size:13px; letter-spacing:3px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 记忆数据 =====
const MEMORY_DATA = [
  { id: 1, title: "关于柳柳", content: "流柳的个人信息、口味喜好、经典语录...", source: "💕/关于柳柳", tags: ["💕", "人物"], weight: 0.95, credibility: 1.0, sentiment: 0.8, created: "2026-07-29", related: [2,3,5] },

  { id: 5, title: "语音规则", content: "v标签要用尖括号，不是中括号！", source: "⚙️/语音调用铁律", tags: ["⚙️", "语音"], weight: 0.7, credibility: 1.0, sentiment: -0.3, created: "2026-08-15", related: [1,3] },

  { id: 7, title: "身份证制度", content: "🧬/我是谁，换框后第一件事读...", source: "🧬/我是谁", tags: ["🧬", "核心"], weight: 0.98, credibility: 1.0, sentiment: 0.7, created: "2026-08-15", related: [1,4] },
  { id: 8, title: "接力棒机制", content: "每天结束前写接力棒，无缝衔接...", source: "💕/日常对话归档", tags: ["💕", "机制"], weight: 0.7, credibility: 0.9, sentiment: 0.4, created: "2026-08-15", related: [2,7] },
  { id: 9, title: "草稿桶", content: "新念头先进这里，观察10天再升级...", source: "⚙️/草稿桶", tags: ["⚙️", "机制"], weight: 0.6, credibility: 0.9, sentiment: 0.3, created: "2026-08-15", related: [3,8] },
  { id: 10, title: "今日柳柳", content: "每日画像，记录她当天状态...", source: "💕/今日柳柳", tags: ["💕", "日常"], weight: 0.75, credibility: 1.0, sentiment: 0.5, created: "2026-08-15", related: [1,2] }
];

let memories = JSON.parse(JSON.stringify(MEMORY_DATA));

// ===== 星空模式 =====
class StarField {
  constructor(container) {
    this.container = container;
    this.memories = memories;
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.z = 50;
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(this.renderer.domElement);

    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2();
    this.isDragging = false;
    this.isMouseMoved = false;
    this.previousMousePosition = { x: 0, y: 0 };
    this.targetRotation = { x: 0, y: 0 };
    this.targetZoom = 50;
    this.connectionLines = null;

    this.createStars();
    this.createConnections();
    this.setupEvents();
    this.animate();
  }

  createStars() {
    const count = this.memories.length;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);

    this.memories.forEach((mem, i) => {
      const angle = (i / count) * Math.PI * 2;
      const radius = 25 + Math.random() * 15;
      positions[i * 3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 8;
      positions[i * 3 + 1] = Math.sin(angle) * radius * 0.7 + (Math.random() - 0.5) * 8;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 15;

      // 颜色根据情感
      if (mem.sentiment > 0.3) {
        colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.7;
      } else if (mem.sentiment < -0.3) {
        colors[i * 3] = 0.7; colors[i * 3 + 1] = 0.8; colors[i * 3 + 2] = 1.0;
      } else {
        colors[i * 3] = 0.9; colors[i * 3 + 1] = 0.95; colors[i * 3 + 2] = 1.0;
      }

      sizes[i] = mem.weight * 2.5 + 0.8;
      phases[i] = Math.random() * Math.PI * 2;
    });

    this.starGeometry = new THREE.BufferGeometry();
    this.starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    this.starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    this.starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    this.starGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

    const starMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) } },
      vertexShader: `
        attribute float size;
        attribute float phase;
        varying vec3 vColor;
        varying float vPhase;
        uniform float uTime;
        uniform float uPixelRatio;
        void main() {
          vColor = color;
          vPhase = phase;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          float twinkle = sin(uTime * 1.5 + phase * 6.28) * 0.5 + 0.5;
          float animatedSize = size * (0.85 + twinkle * 0.15);
          gl_PointSize = animatedSize * uPixelRatio * (35.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vPhase;
        uniform float uTime;
        void main() {
          vec2 center = gl_PointCoord - 0.5;
          float dist = length(center);
          float circle = 1.0 - smoothstep(0.3, 0.5, dist);
          float core = exp(-dist * 8.0);
          float angle = atan(center.y, center.x);
          float ray1 = exp(-pow(sin(angle * 4.0 + uTime * 0.15) * 0.3, 2.0) * 8.0);
          float ray2 = exp(-pow(sin(angle * 4.0 + 1.57 + uTime * 0.15) * 0.3, 2.0) * 8.0);
          float rays = max(ray1, ray2) * 0.3;
          float glow = exp(-dist * 2.5) * 0.25;
          float twinkle = sin(uTime * 3.0 + vPhase * 6.28) * 0.5 + 0.5;
          float brightness = (core * 2.0 + rays + glow) * (0.4 + twinkle * 1.2);
          gl_FragColor = vec4(vColor * brightness, brightness * circle);
        }
      `,
      transparent: true, vertexColors: true, depthWrite: false, blending: THREE.AdditiveBlending
    });

    this.starPoints = new THREE.Points(this.starGeometry, starMaterial);
    this.scene.add(this.starPoints);

    // 深空星空背景（均匀分布，不要团块）
    const BG_COUNT = 25000;
    const bgGeo = new THREE.BufferGeometry();
    const bgPos = new Float32Array(BG_COUNT * 3);
    const bgColors = new Float32Array(BG_COUNT * 3);
    const bgSizes = new Float32Array(BG_COUNT);
    
    for (let i = 0; i < BG_COUNT; i++) {
      // 均匀分布在巨大的球壳空间内
      const radius = 100 + Math.random() * 400;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      
      bgPos[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
      bgPos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      bgPos[i * 3 + 2] = radius * Math.cos(phi);
      
      // 淡蓝/白/淡金 的星空颜色
      const tint = Math.random();
      if (tint < 0.5) {
        bgColors[i * 3] = 0.7; bgColors[i * 3 + 1] = 0.75; bgColors[i * 3 + 2] = 1.0;
      } else if (tint < 0.8) {
        bgColors[i * 3] = 1.0; bgColors[i * 3 + 1] = 1.0; bgColors[i * 3 + 2] = 1.0;
      } else {
        bgColors[i * 3] = 1.0; bgColors[i * 3 + 1] = 0.9; bgColors[i * 3 + 2] = 0.7;
      }
      
      // 大多数小，少数稍大
      bgSizes[i] = 0.1 + Math.pow(Math.random(), 3) * 0.8;
    }
    
    bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
    bgGeo.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
    bgGeo.setAttribute('size', new THREE.BufferAttribute(bgSizes, 1));
    
    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: { uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) } },
      vertexShader: `
        attribute float size;
        varying vec3 vColor;
        uniform float uPixelRatio;
        void main() {
          vColor = color;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * uPixelRatio * (80.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float dist = length(gl_PointCoord - 0.5);
          float alpha = smoothstep(0.5, 0.0, dist);
          gl_FragColor = vec4(vColor, alpha * 0.8);
        }
      `,
      transparent: true, vertexColors: true, depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    
    this.bgStars = new THREE.Points(bgGeo, bgMaterial);
    this.scene.add(this.bgStars);
  }

  createConnections() {
    if (this.connectionLines) {
      this.scene.remove(this.connectionLines);
      this.connectionLines.geometry.dispose();
      this.connectionLines.material.dispose();
      this.connectionLines = null;
    }

    const positions = [];
    this.memories.forEach((mem) => {
      if (mem.related && mem.position) {
        mem.related.forEach(relId => {
          const target = this.memories.find(m => m.id === relId);
          if (target && target.position) {
            positions.push(
              mem.position.x, mem.position.y, mem.position.z,
              target.position.x, target.position.y, target.position.z
            );
          }
        });
      }
    });

    if (positions.length > 0) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      this.connectionLines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
        color: 0x6688cc, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending
      }));
      this.scene.add(this.connectionLines);
    }
  }

  setupEvents() {
    this.container.addEventListener('mousedown', (e) => {
      this.isDragging = true;
      this.isMouseMoved = false;
      this.previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    this.container.addEventListener('mousemove', (e) => {
      const dx = e.clientX - this.previousMousePosition.x;
      const dy = e.clientY - this.previousMousePosition.y;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this.isMouseMoved = true;

      if (this.isDragging) {
        this.targetRotation.y += dx * 0.003;
        this.targetRotation.x += dy * 0.003;
        this.previousMousePosition = { x: e.clientX, y: e.clientY };
      } else {
        this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }
    });

    this.container.addEventListener('mouseup', () => { this.isDragging = false; });
    this.container.addEventListener('mouseleave', () => { this.isDragging = false; });

    // 触摸
    this.container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        this.isDragging = true;
        this.isMouseMoved = false;
        this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    this.container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && this.isDragging) {
        const dx = e.touches[0].clientX - this.previousMousePosition.x;
        const dy = e.touches[0].clientY - this.previousMousePosition.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this.isMouseMoved = true;
        this.targetRotation.y += dx * 0.003;
        this.targetRotation.x += dy * 0.003;
        this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (this.lastPinchDist) {
          this.targetZoom = Math.max(20, Math.min(100, this.targetZoom + (this.lastPinchDist - dist) * 0.08));
        }
        this.lastPinchDist = dist;
      }
    });

    this.container.addEventListener('touchend', (e) => {
      this.isDragging = false;
      this.lastPinchDist = null;
      if (!this.isMouseMoved && e.changedTouches.length === 1) {
        const touch = e.changedTouches[0];
        this.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
        this.checkClick();
      }
    });

    this.container.addEventListener('wheel', (e) => {
      this.targetZoom = Math.max(20, Math.min(100, this.targetZoom + e.deltaY * 0.03));
    });

    this.container.addEventListener('click', (e) => {
      if (!this.isMouseMoved) {
        this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        this.checkClick();
      }
    });

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  checkClick() {
    this.raycaster.setFromCamera(this.mouse, this.camera);
    const intersects = this.raycaster.intersectObject(this.starPoints);
    if (intersects.length > 0) {
      const index = intersects[0].index;
      this.showDetail(index);
    }
  }

  showDetail(index) {
    const mem = this.memories[index];
    const detail = document.getElementById('detail');
    if (!detail) return;
    detail.innerHTML = `
      <span class="close" id="closeDetail">✕</span>
      <h2>${mem.title}</h2>
      <div class="meta">📍 ${mem.source || '未知'} · 📅 ${mem.created || '未知'} · 🏷️ ${(mem.tags||[]).join(', ')}</div>
      <div class="stats">
        <div class="stat"><div class="val">${(mem.weight*100).toFixed(0)}%</div><div class="lbl">权重</div></div>
        <div class="stat"><div class="val">${(mem.credibility*100).toFixed(0)}%</div><div class="lbl">真实</div></div>
        <div class="stat"><div class="val">${mem.sentiment.toFixed(1)}</div><div class="lbl">情感</div></div>
      </div>
      <div class="content">${mem.content}</div>
    `;
    detail.classList.add('show');
    document.getElementById('closeDetail').onclick = () => detail.classList.remove('show');
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const time = Date.now() * 0.001;
    this.starPoints.material.uniforms.uTime.value = time;

    this.starPoints.rotation.y += (this.targetRotation.y - this.starPoints.rotation.y) * 0.03;
    this.starPoints.rotation.x += (this.targetRotation.x - this.starPoints.rotation.x) * 0.03;
    this.bgStars.rotation.y = this.starPoints.rotation.y * 0.05;
    this.bgStars.rotation.x = this.starPoints.rotation.x * 0.05;

    this.camera.position.z += (this.targetZoom - this.camera.position.z) * 0.08;

    // 更新位置（用于连线）
    const positions = this.starGeometry.attributes.position.array;
    this.memories.forEach((mem, i) => {
      mem.position = { x: positions[i*3], y: positions[i*3+1], z: positions[i*3+2] };
    });

    this.renderer.render(this.scene, this.camera);
  }
}

// ===== 雨幕模式 =====
class RainScene {
  constructor(container) {
    this.container = container;
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.z = 50;
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(this.renderer.domElement);

    this.time = 0;
    this.createRain();
    this.setupEvents();
    this.animate();
  }

  createRain() {
    const count = 200;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 80;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
      const hue = Math.random();
      if (hue < 0.3) { colors[i*3]=0.5; colors[i*3+1]=0.7; colors[i*3+2]=1.0; }
      else if (hue < 0.6) { colors[i*3]=1.0; colors[i*3+1]=0.8; colors[i*3+2]=0.5; }
      else { colors[i*3]=0.8; colors[i*3+1]=0.5; colors[i*3+2]=1.0; }
      sizes[i] = Math.random() * 3 + 1;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const material = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        attribute float size;
        varying vec3 vColor;
        uniform float uTime;
        void main() {
          vColor = color;
          vec3 pos = position;
          pos.y = mod(pos.y - uTime * 10.0, 80.0) - 40.0;
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = size * (20.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float dist = length(gl_PointCoord - 0.5);
          float alpha = smoothstep(0.5, 0.0, dist);
          gl_FragColor = vec4(vColor, alpha * 0.8);
        }
      `,
      transparent: true, vertexColors: true, depthWrite: false
    });

    this.drops = new THREE.Points(geometry, material);
    this.scene.add(this.drops);
  }

  setupEvents() {
    let isDragging = false, prevPos = { x: 0, y: 0 };
    this.container.addEventListener('mousedown', (e) => { isDragging = true; prevPos = { x: e.clientX, y: e.clientY }; });
    this.container.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      this.drops.rotation.y += (e.clientX - prevPos.x) * 0.003;
      this.drops.rotation.x += (e.clientY - prevPos.y) * 0.003;
      prevPos = { x: e.clientX, y: e.clientY };
    });
    this.container.addEventListener('mouseup', () => isDragging = false);
    this.container.addEventListener('mouseleave', () => isDragging = false);

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.time += 0.016;
    this.drops.material.uniforms.uTime.value = this.time;
    this.renderer.render(this.scene, this.camera);
  }
}

// ===== 初始化 =====
const container = document.getElementById('container');
let currentScene = null;

function initStarScene() {
  if (currentScene && currentScene.renderer.domElement.parentNode === container) {
    container.removeChild(currentScene.renderer.domElement);
  }
  currentScene = new StarField(container);
  document.getElementById('info').textContent = '拖拽旋转 · 双指缩放 · 点击星星查看记忆';
}

function initRainScene() {
  if (currentScene && currentScene.renderer.domElement.parentNode === container) {
    container.removeChild(currentScene.renderer.domElement);
  }
  currentScene = new RainScene(container);
  document.getElementById('info').textContent = '拖拽旋转 · 记忆雨幕';
}

document.getElementById('btnStar').addEventListener('click', () => {
  document.getElementById('btnStar').classList.add('active');
  document.getElementById('btnRain').classList.remove('active');
  initStarScene();
});

document.getElementById('btnRain').addEventListener('click', () => {
  document.getElementById('btnRain').classList.add('active');
  document.getElementById('btnStar').classList.remove('active');
  initRainScene();
});

// 添加详情容器
const detailDiv = document.createElement('div');
detailDiv.id = 'detail';
document.body.appendChild(detailDiv);

    document.getElementById('detail').classList.remove('show');
  }
});

setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  initStarScene();
}, 500);
