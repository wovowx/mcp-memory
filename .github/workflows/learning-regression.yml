name: learning-regression
# Release-scoped regression gate: source changes must run static and Contents contracts.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: E1 - Static syntax and import checks
        run: npm run check

      - name: E2 - GitHub Contents primitives and workflows
        run: npm run test:github-contents

      - name: E2 - Existing webhook idempotency regression
        run: node tests/webhook_idempotency_test.mjs

      - name: E2 - Memory Core repository, lifecycle and facade contracts
        run: npm run test:memory-core
      - name: E2 - Synthetic Memory Retrieval Quality Benchmark
        run: npm run test:memory-retrieval-benchmark

      - name: E2 - Search history contracts
        run: npm run test:search-history

      - name: E2 - Release Guard regression
        run: node src/modules/release_guard.js

      - name: Learning artifact regression
        run: python3 tests/learning/run_learning_tests.py

      - name: E2 - Router, registry and Patch Engine contracts (frozen Router regression gate)
        run: npm run test:contracts

      - name: E2 - Session Bootstrap read-only recovery contracts
        run: npm run test:bootstrap
